name: release

# Pousser un tag v* suffit : le build PyInstaller tourne sur une machine
# GitHub et la release est publiée avec le zip en pièce jointe.
#
#     git tag v1.0.1
#     git push origin v1.0.1

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build
        run: python -m PyInstaller localflow.spec --noconfirm

      - name: Zip
        run: Compress-Archive -Path dist/localflow -DestinationPath localflow-${{ github.ref_name }}-windows-x64.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: localflow-*-windows-x64.zip
          generate_release_notes: true
